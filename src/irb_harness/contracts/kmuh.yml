workflow:
  states:
    - draft
    - submitted
    - admin_check
    - under_review
    - revision_required
    - approved
    - active
    - suspended
    - terminated
    - closed
    - withdrawn
  transitions:
    - event: submit_new
      from: draft
      to: submitted
      action_risk: submit
      human_confirmation: true
      evidence_refs:
        - source_document_id: kmuh_sop_02_01
          locator_status: needs_retrieval
          locator_hint: "4.2.1.1"
        - source_document_id: kmuh_sop_02_03
          locator_status: needs_retrieval
          locator_hint: "4.3.1"
        - source_document_id: kmuh_sop_02_05
          locator_status: needs_retrieval
          locator_hint: "免審案申請程序"
    - event: administrative_intake
      from: submitted
      to: admin_check
      action_risk: read
      evidence_refs:
        - source_document_id: kmuh_sop_02_01
          locator_status: needs_retrieval
          locator_hint: "4.3.2"
    - event: send_to_review
      from: admin_check
      to: under_review
      action_risk: read
      evidence_refs:
        - source_document_id: kmuh_sop_02_03
          locator_status: needs_retrieval
          locator_hint: "4.3.5.4"
    - event: request_revision
      from: under_review
      to: revision_required
      action_risk: read
      evidence_refs:
        - source_document_id: kmuh_sop_02_03
          locator_status: needs_retrieval
          locator_hint: "4.4.3.2"
    - event: resubmit_revision
      from: revision_required
      to: under_review
      repeatable: true
      action_risk: submit
      human_confirmation: true
      evidence_refs:
        - source_document_id: kmuh_sop_02_07
          locator_status: needs_retrieval
          locator_hint: "複審案申請與審查程序"
    - event: approve
      from: under_review
      to: approved
      action_risk: read
      evidence_refs:
        - source_document_id: kmuh_sop_02_03
          locator_status: needs_retrieval
          locator_hint: "4.4.3.2"
    - event: activate
      from: approved
      to: active
      action_risk: read
      evidence_refs:
        - source_document_id: kmuh_sop_02_03
          locator_status: needs_retrieval
          locator_hint: "1.2"
    - event: submit_amendment
      from: active
      to: active
      repeatable: true
      action_risk: submit
      human_confirmation: true
      evidence_refs:
        - source_document_id: kmuh_sop_02_09
          locator_status: needs_retrieval
          locator_hint: "變更案申請程序"
    - event: submit_continuing_review
      from: active
      to: active
      repeatable: true
      action_risk: submit
      human_confirmation: true
      evidence_refs:
        - source_document_id: kmuh_sop_02_08
          locator_status: needs_retrieval
          locator_hint: "4.3.2"
    - event: report_safety_event
      from: active
      to: active
      repeatable: true
      action_risk: submit
      human_confirmation: true
      evidence_refs:
        - source_document_id: kmuh_sop_03_03
          locator_status: needs_retrieval
          locator_hint: "監測與通報程序"
    - event: report_non_compliance
      from: active
      to: active
      repeatable: true
      action_risk: submit
      human_confirmation: true
      evidence_refs:
        - source_document_id: kmuh_sop_03_04
          locator_status: needs_retrieval
          locator_hint: "事件通報及處置程序"
    - event: suspend
      from: active
      to: suspended
      action_risk: submit
      human_confirmation: true
      evidence_refs:
        - source_document_id: kmuh_sop_02_10
          locator_status: needs_retrieval
          locator_hint: "中止／暫停處理程序"
    - event: resume
      from: suspended
      to: active
      action_risk: submit
      human_confirmation: true
      evidence_refs:
        - source_document_id: kmuh_sop_02_10
          locator_status: needs_retrieval
          locator_hint: "暫停後續處理程序"
    - event: terminate
      from:
        - active
        - suspended
      to: terminated
      action_risk: destructive
      human_confirmation: true
      evidence_refs:
        - source_document_id: kmuh_sop_02_10
          locator_status: needs_retrieval
          locator_hint: "提前終止處理程序"
    - event: close
      from:
        - active
        - terminated
      to: closed
      action_risk: submit
      human_confirmation: true
      evidence_refs:
        - source_document_id: kmuh_sop_02_10
          locator_status: needs_retrieval
          locator_hint: "結案處理程序"
    - event: withdraw
      from:
        - draft
        - submitted
        - admin_check
        - under_review
        - revision_required
      to: withdrawn
      action_risk: destructive
      human_confirmation: true
      evidence_refs:
        - source_document_id: kmuh_sop_02_10
          locator_status: needs_retrieval
          locator_hint: "撤案處理程序"

